[package]
name = "surreal-sync-example-from-kafka"
version = "0.6.0"
edition = "2021"
publish = false
description = "Embedder example: Kafka sync with in-process transforms"

[[bin]]
name = "surreal-sync-example-from-kafka"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
tokio = { version = "1.49", features = ["full"] }
surreal-sync-kafka = { path = "../../crates/kafka", features = ["from_kafka"] }
surreal-sync-surreal = { path = "../../crates/surreal" }
